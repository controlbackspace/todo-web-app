databaseChangeLog:
        - changeSet:
                  id: 1
                  author: jake
                  changes:
                          - createTable:
                                    tableName: todos
                                    columns:
                                            - column:
                                                      name: id
                                                      type: BIGINT
                                                      autoIncrement: true
                                                      constraints:
                                                              primaryKey: true
                                                              nullable: false
                                            - column:
                                                      name: description
                                                      type: VARCHAR(255)
                                                      constraints:
                                                              nullable: false
                                            - column:
                                                      name: completed
                                                      type: BOOLEAN
                                                      defaultValueBoolean: false
                                                      constraints:
                                                              nullable: false