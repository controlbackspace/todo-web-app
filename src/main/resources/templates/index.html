<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Internship Todo App</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: none; }
        del { color: #6c757d; }
    </style>
</head>
<body class="container py-5">

<h1 class="text-center mb-5">Todo Manager</h1>

<div id="todo-app-content" class="row">

    <div class="col-md-6">
        <div class="card p-4">
            <h3 class="mb-4">My Tasks</h3>

            <form hx-post="/add" hx-target="#todo-app-content" hx-swap="innerHTML" class="mb-4">
                <div class="input-group">
                    <input type="text" name="description" class="form-control" placeholder="What needs to be done?" required>
                    <button class="btn btn-primary" type="submit">Add</button>
                </div>
            </form>

            <ul class="list-group list-group-flush">
                <li th:each="todo : ${activeTasks}" class="list-group-item d-flex justify-content-between align-items-center px-0">
                    <span th:text="${todo.description}">Task Name</span>
                    <button class="btn btn-sm btn-outline-success"
                            th:hx-post="'/complete/' + ${todo.id}"
                            hx-target="#todo-app-content"
                            hx-swap="innerHTML">Done</button>
                </li>
                <li th:if="${#lists.isEmpty(activeTasks)}" class="list-group-item text-center text-muted border-0">
                    No active tasks!
                </li>
            </ul>
        </div>
    </div>

    <div class="col-md-6 border-start">
        <div class="ps-md-4">
            <h3 class="text-muted mb-4">History</h3>
            <ul class="list-group list-group-flush">
                <li th:each="todo : ${completedTasks}" class="list-group-item bg-transparent px-0">
                    <del th:text="${todo.description}">Completed Task</del>
                    <span class="badge bg-light text-dark float-end">Done</span>
                </li>
                <li th:if="${#lists.isEmpty(completedTasks)}" class="list-group-item bg-transparent text-center text-muted border-0">
                    Nothing completed yet.
                </li>
            </ul>
        </div>
    </div>

</div> </body>
</html>
